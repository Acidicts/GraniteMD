name: Set up Ruby
description: Installs native library dependencies (libvips, libpoppler) and Ruby with bundler cache.
runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      # libvips is required by ruby-vips, which Bundler.require loads when
      # the Rails app boots; without it every `rails`/`rspec` invocation
      # fails with "Could not open library 'vips.so.42'".
      # ubuntu-latest ships with recent enough apt indexes to resolve
      # libpoppler-glib-dev without a fresh `apt-get update` (~30 s).
      # Re-add one here if a future runner image breaks that.
      run: |
        sudo apt-get update
        sudo apt-get install -y --fix-missing libvips-dev libpoppler-glib-dev
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true
