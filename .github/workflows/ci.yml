name: CI & Docker

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libvips-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager --confidence-level 2

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libvips-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libvips-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  rspec:
    name: RSpec (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel remaining shards when one fails — we want to see all
      # failures in a single run rather than a slow loop of retries.
      fail-fast: false
      matrix:
        # SHARD_TOTAL and this matrix MUST stay equal -- a shard total larger
        # than the matrix silently leaves specs unrun. The coverage guard in
        # the run step below fails the build if they ever disagree, so the
        # drift cannot pass quietly again.
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      # https://docs.github.com/en/actions/tutorials/use-containerized-services/create-redis-service-containers
      redis:
        image: valkey/valkey:8
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ruby
      - uses: ./.github/actions/setup-db
      - name: Run RSpec
        env:
          # Must match the database setup-db creates/loads (granite_test).
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/granite_test
          REDIS_URL: redis://localhost:6379
          RAILS_ENV: test
          # Throwaway keys so CI never depends on a .env file (which is
          # gitignored). These decrypt nothing real -- CI rebuilds its database
          # from schema on every run. Never reuse these values outside test.
          ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: e3thjpxBEMSXvniHfQnAafG+fKhQKv3nu/5Mdh3iAyo=
          ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: z1N3uzTWwPeRhv8EvYtSavEmLD/07uhLw4h4iYui6Po=
          ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: jcp77SZdceuWLZ08+CRQVZ0ro6cNnxnOf9jz7OYO4Mk=
          CC_TEST_REPORTER_ID: "1" # Force SimpleCov to generate a JSON report
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: 4
          # Number of shards GitHub actually created from the matrix above.
          SHARD_MATRIX_SIZE: ${{ strategy.job-total }}
        # Deterministic round-robin split of spec files across shards: sort the
        # file list so each runner computes the same ordering, then keep the
        # files whose 1-based index maps to this shard.
        run: |
          set -euo pipefail

          select_shard() {
            find spec -name '*_spec.rb' | sort | awk -v i="$1" -v n="$SHARD_TOTAL" 'NR % n == (i - 1) % n'
          }

          # Guard against SHARD_TOTAL drifting away from the matrix size, which
          # would silently skip specs entirely: with matrix [1] and
          # SHARD_TOTAL 8, seven eighths of the suite never runs and the build
          # still goes green.
          if [ "$SHARD_TOTAL" -ne "$SHARD_MATRIX_SIZE" ]; then
            echo "SHARD_TOTAL=$SHARD_TOTAL but the matrix created $SHARD_MATRIX_SIZE shard(s). Fix one to match the other." >&2
            exit 1
          fi

          total=$(find spec -name '*_spec.rb' | wc -l | tr -d ' ')
          covered=$(for i in $(seq 1 "$SHARD_TOTAL"); do select_shard "$i"; done | sort -u | wc -l | tr -d ' ')
          if [ "$covered" -ne "$total" ]; then
            echo "Shard matrix covers $covered of $total spec files -- the shards do not partition the suite." >&2
            exit 1
          fi

          specs=$(select_shard "$SHARD_INDEX")
          count=$(echo "$specs" | grep -c . || true)
          if [ "$count" -eq 0 ]; then
            echo "Shard $SHARD_INDEX/$SHARD_TOTAL selected no spec files." >&2
            exit 1
          fi

          echo "Running $count of $total spec files on shard $SHARD_INDEX/$SHARD_TOTAL"
          seed=$RANDOM
          cmd="bundle exec rspec --seed $seed --tag '~skip' $(echo $specs | tr '\n' ' ')"
          echo "To reproduce locally, run:"
          echo "  RAILS_ENV=test bundle exec rails db:drop db:create db:schema:load && \\"
          echo "  $cmd"
          eval "$cmd"
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          # Each shard generates its own coverage file; name them uniquely
          # so the upload action doesn't clash. Merging into a single report
          # can be done in a downstream job if needed.
          name: simplecov-report-shard-${{ matrix.shard }}
          path: coverage/coverage.json

  build:
    name: Build & Push Docker Image
    needs: [scan_ruby, scan_js, lint, rspec]
    # Only push on main branch, not on pull requests
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
